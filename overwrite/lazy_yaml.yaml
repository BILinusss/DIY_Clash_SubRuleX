# https://clashparty.org/docs/guide/override/yaml
x-anchors:
  default-proxies: &default-proxies
    - "🚀 节点选择"
    - "♻️ 自动选择"
    - "🇭🇰 香港节点"
    - "🇹🇼 台湾节点"
    - "🇯🇵 日本节点"
    - "🇺🇸 美国节点"
    - "🇸🇬 新加坡节点"
    - "🇰🇷 韩国节点"
    - "🇬🇧 英国节点"
    - "🇩🇪 德国节点"
    - "🇫🇷 法国节点"
    - "🇨🇦 加拿大节点"
    - "🇦🇺 澳大利亚节点"
    - "🌐 其他节点"
    - DIRECT

  url-test-group: &url-test-group
    type: url-test
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  rule-provider-domain: &rule-provider-domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400

  rule-provider-ip: &rule-provider-ip
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies: ["♻️ 自动选择", "🇭🇰 香港节点", "🇹🇼 台湾节点", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇸🇬 新加坡节点", "🇰🇷 韩国节点", "🇬🇧 英国节点", "🇩🇪 德国节点", "🇫🇷 法国节点", "🇨🇦 加拿大节点", "🇦🇺 澳大利亚节点", "🌐 其他节点", DIRECT]
  - name: "♻️ 自动选择"
    <<: *url-test-group
  - name: "🛑 广告拦截"
    type: select
    proxies: [REJECT, DIRECT]
  - name: "🤖 AI 服务"
    type: select
    proxies: *default-proxies
  - name: "✨ Gemini"
    type: select
    proxies: *default-proxies
  - name: "📹 油管视频"
    type: select
    proxies: *default-proxies
  - name: "🔍 谷歌服务"
    type: select
    proxies: *default-proxies
  - name: "Ⓜ️ 微软服务"
    type: select
    proxies: *default-proxies
  - name: "🍏 苹果服务"
    type: select
    proxies: *default-proxies
  - name: "📲 电报消息"
    type: select
    proxies: *default-proxies
  - name: "🐦 推特/X"
    type: select
    proxies: *default-proxies
  - name: "📘 Meta 系"
    type: select
    proxies: *default-proxies
  - name: "🎬 奈飞"
    type: select
    proxies: *default-proxies
  - name: "🎮 Steam"
    type: select
    proxies: *default-proxies
  - name: "🐱 代码托管"
    type: select
    proxies: *default-proxies
  - name: "☁️ 云服务"
    type: select
    proxies: *default-proxies
  - name: "🛠️ 开发工具"
    type: select
    proxies: *default-proxies
  - name: "🏠 私有网络"
    type: select
    proxies: [DIRECT, "🚀 节点选择"]
  - name: "🔒 国内服务"
    type: select
    proxies: [DIRECT, "🚀 节点选择"]
  - name: "🌍 非中国"
    type: select
    proxies: *default-proxies
  - name: "🐟 漏网之鱼"
    type: select
    proxies: *default-proxies
  - name: "🇭🇰 香港节点"
    <<: *url-test-group
    filter: "(?i)香港|\bHong Kong\b|\bHK\b"
  - name: "🇹🇼 台湾节点"
    <<: *url-test-group
    filter: "(?i)台湾|\bTaiwan\b|\bTW\b"
  - name: "🇯🇵 日本节点"
    <<: *url-test-group
    filter: "(?i)日本|\bJapan\b|\bJP\b"
  - name: "🇺🇸 美国节点"
    <<: *url-test-group
    filter: "(?i)美国|\bUnited States\b|\bUS\b"
  - name: "🇸🇬 新加坡节点"
    <<: *url-test-group
    filter: "(?i)新加坡|\bSingapore\b|\bSG\b"
  - name: "🇰🇷 韩国节点"
    <<: *url-test-group
    filter: "(?i)韩国|\bKorea\b|\bKR\b"
  - name: "🇬🇧 英国节点"
    <<: *url-test-group
    filter: "(?i)英国|\bUnited Kingdom\b|\bUK\b|\bGB\b"
  - name: "🇩🇪 德国节点"
    <<: *url-test-group
    filter: "(?i)德国|\bGermany\b|\bDE\b"
  - name: "🇫🇷 法国节点"
    <<: *url-test-group
    filter: "(?i)法国|\bFrance\b|\bFR\b"
  - name: "🇨🇦 加拿大节点"
    <<: *url-test-group
    filter: "(?i)加拿大|\bCanada\b|\bCA\b"
  - name: "🇦🇺 澳大利亚节点"
    <<: *url-test-group
    filter: "(?i)澳大利亚|\bAustralia\b|\bAU\b"
  - name: "🌐 其他节点"
    <<: *url-test-group
    filter: "(?i)^(?!.*(香港|Hong Kong|\bHK\b|台湾|Taiwan|\bTW\b|日本|Japan|\bJP\b|美国|United States|\bUS\b|新加坡|Singapore|\bSG\b|韩国|Korea|\bKR\b|英国|United Kingdom|\bUK\b|\bGB\b|德国|Germany|\bDE\b|法国|France|\bFR\b|加拿大|Canada|\bCA\b|澳大利亚|Australia|\bAU\b)).*"

